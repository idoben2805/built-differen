<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060911" />
  <title>BUILT DIFFERENT</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BUILT DIFFERENT" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="q-app">
    <header class="q-app-header">
      <span class="q-app-header__logo ltr">BUILT DIFFERENT</span>
      <span id="daily-badge" class="q-app-header__stats"></span>
    </header>

    <main id="screen" class="q-main"></main>

    <!-- Floating rest timer -->
    <div id="rest-bar" class="rest-bar hidden"></div>

    <!-- Mini workout bar: shown only when a workout is active and the tab is not "workout" -->
    <button id="mini-bar" class="q-mini-bar q-mini-bar--float q-mini-bar--fixed" data-nav="workout" hidden></button>

    <!-- Bottom navigation -->
    <nav id="nav" class="q-nav q-nav--fixed">
      <button class="q-nav__item" data-nav="workout"><i data-lucide="dumbbell"></i><span>אימון</span></button>
      <button class="q-nav__item" data-nav="library"><i data-lucide="library-big"></i><span>ספרייה</span></button>
      <button class="q-nav__item" data-nav="nutrition"><i data-lucide="apple"></i><span>תזונה</span></button>
      <button class="q-nav__item" data-nav="progress"><i data-lucide="chart-line"></i><span>מעקב</span></button>
    </nav>

    <div id="modal"></div>
    <div id="toast" class="toast"></div>
  </div>

  <script src="js/data-exercises.js"></script>
  <script src="js/data-foods.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker registered:', reg.scope))
          .catch(err => console.log('ServiceWorker error:', err));
      });
    }
  </script>
</body>
</html>
