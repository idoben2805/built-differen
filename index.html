<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060911" />
  <title>BUILT DIFFERENT</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BUILT DIFFERENT" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-[#060911] text-slate-100 selection:bg-blue-600 selection:text-white">
  <div id="app" class="mx-auto max-w-md min-h-screen relative flex flex-col">
    <!-- Branding header -->
    <header class="app-header sticky top-0 z-30 px-4 pt-3 pb-3 flex items-center justify-between">
      <div class="leading-none">
        <div class="logo">BUILT <span class="text-blue-500">DIFFERENT</span></div>
        <div class="text-[10px] tracking-[0.3em] text-slate-500 mt-1">NO EXCUSES · JUST WORK</div>
      </div>
      <div id="daily-badge" class="daily-badge"></div>
    </header>

    <main id="screen" class="flex-1 px-3 pb-44 pt-2"></main>

    <!-- Floating rest timer -->
    <div id="rest-bar" class="rest-bar hidden"></div>

    <!-- Bottom navigation -->
    <nav id="nav" class="bottom-nav">
      <button data-nav="workout"><i data-lucide="dumbbell"></i><span>אימון</span></button>
      <button data-nav="library"><i data-lucide="library"></i><span>ספרייה</span></button>
      <button data-nav="nutrition"><i data-lucide="apple"></i><span>תזונה</span></button>
      <button data-nav="progress"><i data-lucide="line-chart"></i><span>מעקב</span></button>
    </nav>

    <div id="modal"></div>
    <div id="toast" class="toast"></div>
  </div>

  <script src="js/data-exercises.js"></script>
  <script src="js/data-foods.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker registered:', reg.scope))
          .catch(err => console.log('ServiceWorker error:', err));
      });
    }
  </script>
</body>
</html>
